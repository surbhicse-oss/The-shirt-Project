<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="600" height="600" rx="24" fill="#D4CCC2"/>

  <!-- Main Hanger Graphic -->
  <g transform="translate(0, -10)">
    <!-- Top Hook -->
    <path d="M 300 145 C 270 145 250 175 275 205 C 285 218 296 226 300 240" fill="none" stroke="#3C3D3E" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Left Shoulder -->
    <path d="M 290 248 L 140 310 C 120 318 120 342 140 348 L 225 348" fill="none" stroke="#3C3D3E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Shoulder (with gap near top hook) -->
    <path d="M 325 264 L 460 310 C 480 318 480 342 460 348 L 375 348" fill="none" stroke="#3C3D3E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- SP Monogram Inside Hanger -->
    <!-- 'S' Loop -->
    <path d="M 270 310 C 240 295 240 330 285 344 C 315 354 295 390 255 382 C 230 376 222 360 222 360" fill="none" stroke="#3C3D3E" stroke-width="13" stroke-linecap="round"/>
    
    <!-- 'P' Loop & Stem -->
    <path d="M 300 300 C 355 300 365 342 300 354 L 300 395" fill="none" stroke="#3C3D3E" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- White Typography: The Shirt Project -->
  <text x="300" y="475" font-family="'Montserrat', 'Lato', sans-serif" font-size="52" font-weight="400" fill="#F5F2EC" text-anchor="middle" letter-spacing="2">The Shirt Project</text>

  <!-- Subtitle: Founded & Created by Jatin Gupta -->
  <text x="300" y="525" font-family="'Montserrat', sans-serif" font-size="20" font-weight="600" fill="#3C3D3E" text-anchor="middle" letter-spacing="4">FOUNDED &amp; CREATED BY JATIN GUPTA</text>
</svg>
